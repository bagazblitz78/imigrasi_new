# Edge Nginx: serves the built SPA and reverse-proxies the API to the backend.
# TLS termination should be added here (or on an upstream load balancer).

# Rate-limit zone for the login endpoint (defense-in-depth; app also limits).
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS is only effective over HTTPS; uncomment once TLS is terminated here:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ── Immutable hashed assets ───────────────────────────────────────────
    location /imigrasi/assets/ {
        alias /usr/share/nginx/html/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback (index.html must never be cached) ────────────────────
    location /imigrasi/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /imigrasi/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # ── API login (rate limited at the edge too) ──────────────────────────
    location = /imigrasi/api/v1/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        rewrite ^/imigrasi/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # ── SSE notifications (buffering off, long timeout) ───────────────────
    location /imigrasi/api/v1/notifications/stream {
        rewrite ^/imigrasi/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ── API proxy ─────────────────────────────────────────────────────────
    location /imigrasi/api/ {
        rewrite ^/imigrasi/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
