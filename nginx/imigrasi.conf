# ─────────────────────────────────────────────────────────────────────────────
# Standalone Nginx snippet for deployments that ALREADY run an edge Nginx.
# Paste inside an existing `server { }` block that terminates TLS.
#
# - Frontend static build goes to /html/imigrasi/ (bind mount ./html:/html)
# - API is proxied to the backend container on the shared Docker network.
# ─────────────────────────────────────────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=imigrasi_login:10m rate=10r/m;

# Static SPA (immutable hashed assets, no-cache index)
location /imigrasi/assets/ {
    alias /html/imigrasi/assets/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /imigrasi/ {
    alias /html/imigrasi/;
    index index.html;
    try_files $uri $uri/ /imigrasi/index.html;
    add_header Cache-Control "no-cache" always;
}

# Login rate limit at the edge
location = /imigrasi/api/v1/auth/login {
    limit_req zone=imigrasi_login burst=5 nodelay;
    rewrite ^/imigrasi/api/(.*)$ /api/v1/$1 break;
    proxy_pass http://imigrasi_backend:8000;
    include proxy_params_imigrasi.inc;
}

# SSE notification stream — buffering off
location /imigrasi/api/v1/notifications/stream {
    rewrite ^/imigrasi/api/(.*)$ /api/v1/$1 break;
    proxy_pass http://imigrasi_backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding on;
}

# API proxy
location /imigrasi/api/ {
    rewrite ^/imigrasi/api/(.*)$ /api/v1/$1 break;
    proxy_pass http://imigrasi_backend:8000;
    include proxy_params_imigrasi.inc;
}
